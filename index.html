<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Skin Workshop</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MC Skin Workshop</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Editor</a>
            <a href="#">Gallery</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Create, Edit & Share Minecraft Skins</h2>
            <p>The all-in-one Minecraft skin platform.</p>

            <input type="file" id="skinUpload" accept="image/png">
            <p id="uploadStatus">No skin loaded yet.</p>

            <img id="skinPreview" alt="Skin Preview">
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
